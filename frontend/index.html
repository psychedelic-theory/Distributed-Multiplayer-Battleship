<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>BATTLESHIP — Universal Client</title>
  <meta name="description" content="A universal Battleship client. Bring your own server." />

  <!-- Typography: distinctive pairing, not generic -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,600;0,9..144,800;1,9..144,600&family=JetBrains+Mono:wght@400;500;700&family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >

  <link rel="stylesheet" href="./css/tokens.css" />
  <link rel="stylesheet" href="./css/base.css" />
  <link rel="stylesheet" href="./css/layout.css" />
  <link rel="stylesheet" href="./css/components.css" />
  <link rel="stylesheet" href="./css/board.css" />
  <link rel="stylesheet" href="./css/animations.css" />
</head>
<body>
  <!-- Atmospheric background layers -->
  <div class="bg-layers" aria-hidden="true">
    <div class="bg-grid"></div>
    <div class="bg-glow bg-glow--one"></div>
    <div class="bg-glow bg-glow--two"></div>
    <div class="bg-noise"></div>
  </div>

  <!-- App root — screens are rendered here -->
  <div id="app" class="app-shell"></div>

  <!-- Toast container -->
  <div id="toast-region" class="toast-region" role="status" aria-live="polite"></div>

  <!-- App bootstrap -->
  <script type="module" src="./js/main.js"></script>
</body>
</html>
